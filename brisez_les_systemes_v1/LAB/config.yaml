  nodes_quick: 50000
  nodes_publish: 500000
  multipv: 8
  hash_mb: 512
  threads: 2
  grade_thresholds_cp:
    A: 25
    B: 50
    C: 80

maia3:
  model: maia3-79m
  pinned_revision: 1e13597c42d4858b7cfd7cfdae01e297263364b2
